[project]
name = "rocisa"
version = "0.1.0"
description = "A C++ code generator for ROCm ISA"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = ["-DHIPBLASLT_ENABLE_YAML=ON", "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"]
# No pure-Python packages to scan; the wheel contents come entirely from
# cmake install() rules (_rocisa.so + __init__.py → rocisa/).
wheel.packages = []
# Persistent build tree so repeated editable installs recompile incrementally
# instead of from scratch, and so `editable.rebuild` below can do a fast
# incremental rebuild. {wheel_tag} keeps per-interpreter/ABI build trees
# separate.
build-dir = "build/{wheel_tag}"
# `uv sync` installs rocisa editable; this recompiles changed C++ automatically
# on `import rocisa`, replacing the hand-rolled rebuild that `invoke rocisa`
# used to drive. The staleness guard in rocisa/__init__.py remains as a backstop.
editable.rebuild = true

# Editable (dev) builds only: install _build_info.py so the staleness guard is
# active, and build the stinkytofu example plugin so the rocisa plugin tests can
# exercise it. Neither leaks into the wheel built for `pip install rocisa/`
# (component CI), keeping released/CI wheels lean.
[[tool.scikit-build.overrides]]
if.state = "editable"
cmake.define.ROCISA_INCLUDE_BUILD_INFO = "ON"
cmake.define.STINKYTOFU_BUILD_EXAMPLES = "ON"
